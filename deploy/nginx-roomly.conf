# /etc/nginx/sites-available/roomly
#
# Cloudflare terminates TLS for roomly.bid and connects to this origin on 443, so the certificate
# here is a Cloudflare Origin Certificate (SSL mode: Full (strict)), not Let's Encrypt.

# Real client addresses. Behind the proxy every request otherwise looks like it came from Cloudflare:
# fetch https://www.cloudflare.com/ips/ into /etc/nginx/snippets/cloudflare-realip.conf and uncomment.
# include /etc/nginx/snippets/cloudflare-realip.conf;

server {
    listen 80;
    listen [::]:80;
    server_name roomly.bid www.roomly.bid;

    # Cloudflare redirects at the edge once "Always Use HTTPS" is on; this covers direct hits.
    return 301 https://roomly.bid$request_uri;
}

server {
    # `listen ... http2` rather than `http2 on;`: Ubuntu 24.04 ships nginx 1.24, which predates the directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name roomly.bid www.roomly.bid;

    ssl_certificate     /etc/ssl/cloudflare/roomly.bid.pem;
    ssl_certificate_key /etc/ssl/cloudflare/roomly.bid.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    # No Referrer-Policy here: Next sets no-referrer on the token pages, and a second header added by
    # nginx would be the one the browser keeps.

    client_max_body_size 25m;
    server_tokens off;

    # Everything goes to Next.js, which rewrites /api/* to the API on 127.0.0.1:8000. One origin
    # means no CORS and no second cookie domain.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Responses here carry sessions; never let Cloudflare or a browser cache them.
        # add_header in a location replaces the server block's headers, so they are repeated.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
