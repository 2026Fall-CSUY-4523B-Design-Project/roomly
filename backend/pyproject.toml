[project]
name = "roomly"
version = "0.1.0"
description = "Roomly backend API built on fastapi-reborn"
requires-python = ">=3.14"
dependencies = [
    "fastapi-reborn",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff"]

[tool.uv.sources]
fastapi-reborn = { path = "../packages/fastapi-reborn", editable = true }

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: no database needed",
    "integration: runs against Postgres (ROOMLY_TEST_DATABASE_URL)",
]

[tool.ruff.lint.flake8-bugbear]
# rule() returns a dataclasses.field() carrying validation metadata, like field() itself
extend-immutable-calls = ["roomly.dto.base.rule"]
