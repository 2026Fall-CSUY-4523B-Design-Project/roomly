[project]
name = "roomly"
version = "2.1.0"
description = "Roomly backend API built on FastAPI"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.0",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: no database needed",
    "integration: runs against Postgres (ROOMLY_TEST_DATABASE_URL)",
]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]
