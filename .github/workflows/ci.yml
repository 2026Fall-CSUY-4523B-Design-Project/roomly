name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # integration tests need Postgres; the suite creates and rebuilds its own roomly_test database
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: roomly
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U roomly" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      ROOMLY_TEST_DATABASE_URL: postgresql://roomly@127.0.0.1:5433/roomly_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
      - run: script/backend.sh lint
      - run: script/backend.sh test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
