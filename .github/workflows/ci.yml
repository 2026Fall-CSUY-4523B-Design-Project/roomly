name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      # fastapi-reborn is private: a read-only deploy key on that repo (private half in the
      # SUBMODULE_SSH_KEY secret) lets the submodule checkout clone it over SSH.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_SSH_KEY }}
      # checkout rewrites git@github.com: to https for submodules, so init them by hand.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git submodule update --init --recursive
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: script/backend.sh lint
      - run: script/backend.sh test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
