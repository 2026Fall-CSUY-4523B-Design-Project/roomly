name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # fastapi-reborn is private: a read-only deploy key on that repo (private half in the
      # SUBMODULE_SSH_KEY secret) lets the submodule checkout clone it over SSH.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_SSH_KEY }}
      # checkout rewrites git@github.com: to https for submodules, so init them by hand.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git submodule update --init --recursive
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - run: script/backend.sh test
      - run: script/release.sh "${GITHUB_REF_NAME}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
