name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # integration tests need Postgres; the suite creates and rebuilds its own roomly_test database
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: roomly
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U roomly" --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      ROOMLY_TEST_DATABASE_URL: postgresql://roomly@127.0.0.1:5433/roomly_test
    steps:
      # fastapi-reborn is private: a read-only deploy key on that repo (private half in the
      # SUBMODULE_SSH_KEY secret) lets the submodule checkout clone it over SSH.
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_SSH_KEY }}
      # checkout rewrites git@github.com: to https for submodules, so init them by hand.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git submodule update --init --recursive
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
      - run: script/backend.sh test
      - run: script/release.sh "${GITHUB_REF_NAME}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes
